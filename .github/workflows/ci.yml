name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: 型チェック
        run: pnpm typecheck
      - name: 依存方向
        run: pnpm deps:check
      - name: デザイントークン
        run: pnpm design:check
      - name: 設計文書（リンクと参照）
        run: pnpm docs:check
      - name: テスト（カバレッジ付き）
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 画面（apps/web）ができるまではジョブを成功扱いのまま中身を省略する（必須チェックを満たすため）。
      # 本番ビルドの配信と E2E の有効化は #50 で行う
      - id: gate
        run: |
          if [ -f apps/web/package.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "apps/web がまだないため E2E を省略します"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.enabled == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.gate.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.gate.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - if: steps.gate.outputs.enabled == 'true'
        name: E2E（本番ビルドに対して実行）
        run: pnpm test:e2e
        env:
          MYMIND_AGENT: fake
      - uses: actions/upload-artifact@v4
        if: failure() && steps.gate.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
