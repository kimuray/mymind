name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NFR-26：重大度 high 以上の既知の脆弱性があれば失敗させる（moderate 以下は Dependabot の更新で扱う）
      - name: 依存関係の脆弱性
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm lint
      - name: 型チェック
        run: pnpm typecheck
      - name: 依存方向
        run: pnpm deps:check
      - name: デザイントークン
        run: pnpm design:check
      - name: 設計文書（リンクと参照）
        run: pnpm docs:check
      - name: テスト（カバレッジ付き）
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # サーバーが画面の本番ビルドを配信できるようになるまで（#50）は、ジョブを成功扱いのまま中身を省略する
      # （必須チェックを満たすため）。#50 でこの値を true にする
      - id: gate
        env:
          E2E_ENABLED: "false"
        run: |
          if [ "$E2E_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "E2E は無効です（ci.yml の E2E_ENABLED。#50 で有効にする）"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.enabled == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.gate.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.gate.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - if: steps.gate.outputs.enabled == 'true'
        name: E2E（本番ビルドに対して実行）
        run: pnpm test:e2e
        env:
          MYMIND_AGENT: fake
      - uses: actions/upload-artifact@v4
        if: failure() && steps.gate.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
