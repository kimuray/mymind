name: Issue dependencies

# issue が閉じたら、その issue に依存していた issue の status:blocked を見直す。
# 依存は issue 本文の「依存: #12, #13」の行で表す（書き方は .claude/rules/workflow.md の「Issue の運用」）。
on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const closed = context.payload.issue.number;
            const { owner, repo } = context.repo;

            const removeLabel = async (issue_number, name) => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            };

            await removeLabel(closed, 'status:in-progress');

            const blocked = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'status:blocked', per_page: 100,
            });
            for (const issue of blocked) {
              if (issue.pull_request) continue;
              const line = (issue.body || '').match(/^依存:\s*(.+)$/m);
              if (!line) continue;
              const deps = [...line[1].matchAll(/#(\d+)/g)].map((m) => Number(m[1]));
              if (!deps.includes(closed)) continue;
              const states = await Promise.all(
                deps.map((n) => github.rest.issues.get({ owner, repo, issue_number: n }).then((r) => r.data.state)),
              );
              if (!states.every((s) => s === 'closed')) continue;
              await removeLabel(issue.number, 'status:blocked');
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['status:ready'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `依存していた issue（${deps.map((n) => `#${n}`).join(', ')}）がすべて閉じたため、status:ready にしました。`,
              });
              core.info(`#${issue.number} を status:ready にしました`);
            }
